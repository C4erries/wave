services:
  broker:
    build:
      context: ../wave-mq
    container_name: wave-mq
    command:
      - "-data-dir=/data"
      - "-bind=:7912"
      - "-mqtt=:1883"
      - "-http=:8090"
    ports:
      - "7912:7912"
      - "1883:1883"
      - "8090:8090"
    volumes:
      - wave_demo_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/api/broker"]
      interval: 3s
      timeout: 5s
      retries: 10

  ui:
    build:
      context: ../wave-ui
      args:
        VITE_API_BASE_URL: ""
        VITE_METRICS_URL: ""
    container_name: wave-ui
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8080:80"

  wave-gen:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.integration
    container_name: wave-gen
    command: wave-gen --waveform=sine --freq=1000 --rate=10 --broker=broker:7912
    depends_on:
      broker:
        condition: service_healthy
    restart: on-failure

  wave-fft-gen:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.integration
    container_name: wave-fft-gen
    command: wave-fft --input-topic=raw.gen.chA --output-topic=spectrum.gen.chA --group-id=fft-gen --broker=broker:7912
    depends_on:
      broker:
        condition: service_healthy
    restart: on-failure

  wave-fft-osc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.integration
    container_name: wave-fft-osc
    command: wave-fft --input-topic=raw.osc.chA --output-topic=spectrum.osc.chA --group-id=fft-osc-chA --broker=broker:7912
    depends_on:
      broker:
        condition: service_healthy
    restart: on-failure

volumes:
  wave_demo_data:
