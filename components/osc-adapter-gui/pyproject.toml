[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wave-osc-gui"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "wave-integration",
]

[project.scripts]
wave-osc-gui = "wave_osc_gui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
