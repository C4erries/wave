[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wave-integration"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "wave-python-sdk",
    "PyYAML",
]

[project.optional-dependencies]
picoscope = ["picosdk>=1.1"]
dev = ["pytest"]

[project.scripts]
wave-gen = "wave_integration.producers.synth:main"
wave-fft = "wave_integration.operators.fft_op:main"
wave-osc = "wave_integration.producers.osc:main"

[tool.setuptools.packages.find]
where = ["src"]
